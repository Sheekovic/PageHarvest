[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ChromeMultiOSUA"
version = "0.2.0"
description = "Chrome user-agent strings for Windows, macOS, Linux, Android, and iOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.3,<3"]

[project.urls]
Repository = "https://github.com/Sheekovic/ChromeMultiOSUA"

[tool.setuptools]
py-modules = ["chrome_multi_os_ua"]
