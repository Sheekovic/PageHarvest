[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pageharvest"
version = "1.0.0"
description = "Simple browser profiles and smart URLs-to-JSON/CSV scraping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.3,<3", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
render = ["playwright>=1.48,<2"]

[project.scripts]
pageharvest = "pageharvest.cli:main"

[project.urls]
Repository = "https://github.com/Sheekovic/PageHarvest"
Documentation = "https://github.com/Sheekovic/PageHarvest/tree/main/docs"
Issues = "https://github.com/Sheekovic/PageHarvest/issues"

[tool.setuptools]
py-modules = ["chrome_multi_os_ua"]
packages = ["pageharvest"]
