name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -v
      - name: Check installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from chrome_multi_os_ua import UserAgentGenerator; print(UserAgentGenerator(offline=True).generate_user_agent())"
